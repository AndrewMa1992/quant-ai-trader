[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-ai-trader"
version = "2.1.0"
description = "Head-of-Quant-Fund grade AI trading system v2.1"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [{name = "Quant AI Team"}]

dependencies = [
    # Core Framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",

    # Data Processing
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "pyarrow>=15.0.0",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "redis[hiredis]>=5.0.1",

    # Machine Learning
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "catboost>=1.2.3",

    # Deep Learning
    "torch>=2.2.0",
    "transformers>=4.30.0",

    # Reinforcement Learning
    "stable-baselines3>=2.2.0",
    "gymnasium>=0.29.0",

    # Optimization
    "optuna>=3.5.0",
    "mlflow>=2.10.0",
    "cvxpy>=1.4.1",
    "osqp>=0.6.5",

    # Financial Data
    "yfinance>=0.2.36",
    "tigeropen>=3.5.8",
    "ta>=0.10.2",

    # Genetic Programming
    "gplearn>=0.4.1",

    # Statistics
    "statsmodels>=0.14.1",

    # Validation & Settings
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",

    # Logging
    "loguru>=0.7.2",

    # HTTP
    "httpx>=0.26.0",

    # Serialization
    "orjson>=3.9.0",

    # Utilities
    "tqdm>=4.66.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "schedule>=1.2.0",
    "psutil>=5.9.0",

    # Notifications
    "slack-sdk>=3.27.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "shared*", "configs*", "api_gateway*", "services*"]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.yaml", "*.yml", "*.json", "*.env"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.isort]
known-first-party = ["shared", "configs", "api_gateway", "backend"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
