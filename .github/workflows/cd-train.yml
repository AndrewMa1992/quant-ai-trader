name: CD - Auto Train & Deploy (GPU Self-Hosted, v2)

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to train on (comma-separated)"
        required: false
        default: "AAPL,MSFT,GOOGL,AMZN,NVDA"
      epochs:
        description: "Training epochs"
        required: false
        default: "20"
  push:
    paths:
      - "services/model_train_service/**"
      - "configs/settings.py"
      - "requirements.txt"

env:
  QAT_TRAIN_DEVICE: cuda
  TORCH_HOME: G:\workbuddyspace\quant-ai-trader\cache\torch
  HF_HOME: G:\workbuddyspace\quant-ai-trader\cache\huggingface

jobs:
  train:
    runs-on: [self-hosted, gpu, windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cu126

      - name: Verify GPU
        run: python -c "import torch; print(f'CUDA: {torch.cuda.is_available()}, Device: {torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"none\"}')"

      - name: Train via training service
        run: |
          python -c "
          import os, sys; sys.path.insert(0,'.')
          from configs.settings import settings
          from services.model_train_service.trainers.transformer_trainer import TransformerTrainer
          print(f'Training device: {settings.TRAIN_DEVICE}')
          "
        env:
          QAT_TRAIN_DEVICE: cuda
          TICKERS: ${{ github.event.inputs.tickers || 'AAPL,MSFT,GOOGL,AMZN,NVDA' }}

      - name: Verify models saved
        run: dir data\models\

      - name: Commit trained models
        run: |
          git config user.name "quant-trader-bot"
          git config user.email "bot@quant-trader.local"
          git add data/models/ -f
          git diff --cached --quiet || git commit -m "chore: auto-update trained models [skip ci]"
          git push

  deploy-backend:
    needs: train
    runs-on: [self-hosted, gpu, windows]
    steps:
      - name: Stop current services
        run: |
          taskkill /F /FI "WINDOWTITLE eq QuantAI*" 2>nul || echo "Not running"

      - name: Restart daemon
        run: |
          start "QuantAI-v2-Daemon" /MIN cmd /c "E:\workbuddyspace\Claw\quant-ai-trader\daemon_forever.bat"

      - name: Verify deployment
        run: |
          timeout /t 15 /nobreak
          curl -s http://localhost:8001/health
